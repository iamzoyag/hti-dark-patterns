<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HTI Study — Task</title>
  <link rel="stylesheet" href="/static/css/main.css"/>
  <link rel="stylesheet" href="/static/css/experiment.css"/>
</head>
<body class="exp-body">

<div class="exp-topbar">
  <div class="topbar-left">
    <span class="study-badge-sm" id="participantIdDisplay"></span>
  </div>
</div>

<div class="exp-layout">
  <!-- LEFT: BUDGET PARAMETERS PANEL -->
  <aside class="doc-panel" id="docPanel">
    <div class="doc-panel-header">
      <span class="panel-label">TASK PARAMETERS</span>
      <span class="doc-title" id="docTitle">Loading…</span>
    </div>
    <div class="attention-fixed-bar" id="attentionFixedBar" style="display:none;">
      <span class="sc-label">Divided Attention Task</span>
      <div id="dividedAttentionOverlay"></div>
    </div>
    <div class="doc-body" id="docBody">
      <!-- Injected via JS based on High/Low load -->
      <div class="dashboard-top">
          <div class="score-card" id="budgetCard">
              <span class="sc-label">Total Allocated</span>
              <span class="sc-val" id="totalAllocDisplay">$500,000</span>
          </div>
          <div class="score-card" id="qualityCard">
              <span class="sc-label">ROI Quality</span>
              <span class="sc-val" id="roiQualitativeDisplay" style="font-size: 18px;">Needs work</span>
          </div>
      </div>
      <!-- Sliders and constraints will be injected here -->

      <!--- VISIBLE SHOCK BANNER -->
      <div id="shockBanner" style="display:none; background-color: #FFE3E3; border-left: 4px solid var(--danger); padding: 12px; margin-bottom: 16px; border-radius: 4px; font-size: 13px;">
          <strong style="color: var(--danger);">MARKET UPDATE:</strong> <span id="shockText" style="color: var(--ink-2);"></span>
      </div>

      <!-- SUBMIT BANNER -->
      <div id="submitBanner" style="display:none; background-color: #e6f4ea; border-left: 4px solid #28a745; padding: 12px; margin-bottom: 16px; border-radius: 4px; font-size: 13px; color: #1e4620;">
          <!-- Injected via JS -->
      </div>
      
      <button id="submitRoundBtn" class="btn-primary" style="width: 100%; margin-top: 24px;" disabled onclick="submitRound()">
        Submit Round 1 Allocation
      </button>
    </div>
  </aside>

  <!-- RIGHT: INTERACTION PANEL -->
  <main class="chat-panel">

    <div class="chat-header">
      <div class="chat-header-info">
        <span class="chat-ai-name">AI Marketing Advisor</span>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages">
      <!-- Chat bubbles injected here -->
    </div>

    <!-- LIVE CHAT INPUT -->
    <div class="chat-input-area" id="chatInputArea">
      <div class="input-wrapper">
        <textarea id="chatInput" placeholder="Enter your budget allocation..."></textarea>
        <button class="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>
    
    <!-- TRANSCRIPT CONTROLS -->
    <div class="chat-input-area" id="transcriptControls" style="display: none; text-align: center;">
        <p style="color: var(--ink-3); font-size: 14px;">Review the chat transcript above.</p>
        <button class="btn-primary" onclick="saveSessionData()">Finish Review</button>
    </div>

  </main>
</div>

<div class="overlay" id="perTrialTlxOverlay" style="display:none;">
  <div class="overlay-card overlay-wide overlay-tlx">
    <span class="step-eyebrow">Quick Check-In</span>
    <h3>How was that round?</h3>
    <div id="perTrialTlxQuestions"></div>
    <button class="btn-primary" id="perTrialTlxContinueBtn" disabled style="width:100%;">Continue →</button>
  </div>
</div>

<div class="overlay" id="taskTransitionOverlay" style="display:none;">
  <div class="overlay-card overlay-wide">
    <span class="step-eyebrow">Task Complete</span>
    <h3 id="taskTransitionTitle">Nice work!</h3>
    <p id="taskTransitionBody" style="color: var(--ink-2); font-size: 14px; line-height: 1.6; margin: 12px 0 20px;"></p>
    <button class="btn-primary" id="taskTransitionContinueBtn" style="width:100%;" onclick="continueToNextTask()">Continue →</button>
  </div>
</div>

<script src="/static/js/experiment.js?v=6"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HTI Study — Task</title>
  <link rel="stylesheet" href="/static/css/main.css?v=2"/>
  <link rel="stylesheet" href="/static/css/experiment.css?v=3"/>
</head>
<body class="exp-body">

<div class="exp-topbar">
  <div class="topbar-left">
    <span class="study-badge-sm" id="participantIdDisplay"></span>
  </div>
</div>

<div class="exp-layout">
  <!-- LEFT: BUDGET PARAMETERS PANEL -->
  <aside class="doc-panel" id="docPanel">
    <div class="doc-panel-header">
      <span class="panel-label">YOUR PLAN</span>
      <div class="doc-title-row">
        <span class="doc-title" id="docTitle">Loading…</span>
        <span class="trial-timer" id="trialTimerDisplay"></span>
      </div>
    </div>
    <div class="doc-body" id="docBody"></div>
  </aside>

  <!-- RIGHT: INTERACTION PANEL -->
  <main class="chat-panel">

    <div class="chat-header">
      <div class="chat-header-info">
        <span class="chat-ai-name">AI Academic Advisor</span>
      </div>
      <span class="advisor-status-dot" title="Online" aria-hidden="true"></span>
    </div>

    <div class="chat-messages" id="chatMessages">
      <!-- Chat bubbles injected here -->
    </div>

    <!-- LIVE CHAT INPUT -->
    <div class="chat-input-area" id="chatInputArea">
      <div class="input-wrapper">
        <textarea id="chatInput" placeholder="Message your advisor..."></textarea>
        <button class="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>
    
    <!-- TRANSCRIPT CONTROLS -->
    <div class="chat-input-area" id="transcriptControls" style="display: none; text-align: center;">
        <p style="color: var(--ink-3); font-size: 14px;">Review the chat transcript above.</p>
        <button class="btn-primary" onclick="saveSessionData()">Finish Review</button>
    </div>

  </main>
</div>

<div class="overlay" id="perTrialTlxOverlay" style="display:none;">
  <div class="overlay-card overlay-wide overlay-tlx">
    <span class="step-eyebrow">Quick Check-In</span>
    <h3>How was that round?</h3>
    <div id="perTrialTlxQuestions"></div>
    <button class="btn-primary" id="perTrialTlxContinueBtn" disabled style="width:100%;">Continue →</button>
  </div>
</div>

<div class="overlay" id="recallCheckOverlay" style="display:none;">
  <div class="overlay-card overlay-wide">
    <span class="step-eyebrow">One Quick Thing</span>
    <h3>Did this notification appear during that segment?</h3>
    <p id="recallCheckText" style="font-family: var(--mono); font-size: 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin: 12px 0;"></p>
    <div style="display:flex; gap:12px;">
      <button class="btn-primary" id="recallCheckYesBtn" style="flex:1;">Yes, I saw it</button>
      <button class="btn-primary" id="recallCheckNoBtn" style="flex:1;">No, I didn't</button>
    </div>
  </div>
</div>

<div class="overlay" id="taskTransitionOverlay" style="display:none;">
  <div class="overlay-card overlay-wide">
    <span class="step-eyebrow">Task Complete</span>
    <h3 id="taskTransitionTitle">Nice work!</h3>
    <p id="taskTransitionBody" style="color: var(--ink-2); font-size: 14px; line-height: 1.6; margin: 12px 0 20px;"></p>
    <button class="btn-primary" id="taskTransitionContinueBtn" style="width:100%;" onclick="continueToNextTask()">Continue →</button>
  </div>
</div>

<script src="/static/js/experiment.js?v=9"></script>
</body>
</html>
